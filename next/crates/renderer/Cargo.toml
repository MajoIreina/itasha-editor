[package]
name = "itasha-renderer"
version.workspace = true
edition.workspace = true

[dependencies]
wgpu = "=26.0.1"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras", "extensions"] }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
itasha-contracts.workspace = true
itasha-surface-map.workspace = true
serde_json.workspace = true
sha2.workspace = true
pollster = "=0.4.0"

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
