[workspace]
resolver = "2"
members = ["crates/contracts", "crates/domain", "crates/persistence", "crates/application", "crates/surface-map", "crates/renderer", "src-tauri"]
default-members = ["crates/contracts", "crates/domain", "crates/persistence", "crates/application", "crates/surface-map", "crates/renderer"]

[workspace.package]
version = "0.3.0-dev.6"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
sha2 = "0.10"
itasha-contracts = { path = "crates/contracts" }
itasha-domain = { path = "crates/domain" }
itasha-persistence = { path = "crates/persistence" }
itasha-application = { path = "crates/application" }
itasha-surface-map = { path = "crates/surface-map" }

[profile.release]
lto = "thin"
strip = true
